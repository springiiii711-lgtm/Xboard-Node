name: Checkout build - no publication
"on":
  # Register this workflow on imported repositories; push never runs a job.
  push:
    paths:
      - .github/workflows/checkout-build.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

concurrency:
  group: checkout-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Native installer and publication guard regression
        run: |
          python3 -B -m unittest discover -s ops/private-node/tests -p 'test_*.py' -v
          python3 -B -m unittest discover -s ci -p 'test_native*.py' -v
      - name: Fetch locked dependencies and build both upstream native targets
        env:
          GOTOOLCHAIN: local
        run: |
          go mod download
          go mod verify
          GOPROXY=off go test -mod=readonly -count=1 ./cmd/xbctl
          GOPROXY=off python3 -B ci/native-build.py --source-revision "$GITHUB_SHA" --output "$RUNNER_TEMP/native"
      - name: Offline native amd64 and emulated arm64 version checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user
          python3 -B ci/native-smoke.py --directory "$RUNNER_TEMP/native" --source-revision "$GITHUB_SHA"
          echo 'Both native architectures built; version commands only. No service, publication or deployment.'
      - name: Exercise real systemd with isolated disposable sleep fixtures
        env:
          CI_SAFE_NATIVE_TESTS: '1'
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_EVENT_NAME,GITHUB_REPOSITORY,GITHUB_SHA,RUNNER_TEMP,CI_SAFE_NATIVE_TESTS python3 -B ci/native-service-check.py --directory "$RUNNER_TEMP/native"
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up compatible Go from go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate workflow and checkout
        env:
          GOTOOLCHAIN: local
        run: |
          python3 ci/validate.py
          python3 -B -m unittest discover -s ops/private-node/tests -p "test_*.py" -v
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          go run -mod=readonly ./ci/check-workflow.go .github/workflows/*.yml
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Test and build current checkout image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ci/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: local/xboard-node-checkout:${{ github.sha }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
      - name: Verify installer with network-disabled disposable fixture containers
        env:
          CI_SAFE_DOCKER_TESTS: "1"
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_TEMP,GITHUB_RUN_ID,GITHUB_SHA,CI_SAFE_DOCKER_TESTS python3 -B ci/installer-container-check.py --image "local/xboard-node-checkout:$GITHUB_SHA"
      - name: Offline version check and local packaging
        run: |
          image="local/xboard-node-checkout:$GITHUB_SHA"
          docker run --rm --network none "$image" -v
          docker image save "$image" --output "$RUNNER_TEMP/xboard-node-image.tar"
          sha256sum "$RUNNER_TEMP/xboard-node-image.tar"
          echo 'No node service started; image remains on the temporary runner only.'
