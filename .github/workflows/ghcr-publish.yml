name: Publish private GHCR image
"on":
  # Registration only; both jobs require an explicitly dispatched run.
  push:
    paths:
      - .github/workflows/ghcr-publish.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  IMAGE: ghcr.io/springiiii711-lgtm/xboard-node
  TAG: sha-${{ github.sha }}

concurrency:
  group: private-ghcr-xboard-node
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'springiiii711-lgtm/Xboard-Node' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.published.outputs.digest }}
    steps:
      - name: Prepare isolated temporary registry authentication
        run: |
          umask 077
          auth_dir=$(mktemp -d "$RUNNER_TEMP/ghcr-auth.XXXXXX")
          echo "DOCKER_CONFIG=$auth_dir" >> "$GITHUB_ENV"
      - name: Checkout exact source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate source and publication guards
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B ci/validate.py
          python3 -B -m unittest discover -s ci -p test_ghcr.py -v

      - name: Check private repository and target package before building
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ci/ghcr.py state
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Read source metadata
        id: source
        run: |
          echo "source=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Build and load the exact checkout image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ci/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}

      - name: Check source identity and run offline before publication
        run: python3 -B ci/ghcr.py check-local
      - name: Recheck private package and immutable tag immediately before push
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ci/ghcr.py state
      - name: Authenticate with this job's short-lived token
        if: steps.state.outputs.digest == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish the tested image under its full source SHA
        if: steps.state.outputs.digest == ''
        run: docker push "$IMAGE:$TAG"
      - name: Verify private package metadata and capture its immutable digest
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ci/ghcr.py published
      - name: Remove temporary registry authentication
        if: always()
        run: docker logout ghcr.io

  verify-pull:
    needs: publish
    if: ${{ github.event_name == 'workflow_dispatch' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - name: Prepare isolated temporary registry authentication
        run: |
          umask 077
          auth_dir=$(mktemp -d "$RUNNER_TEMP/ghcr-auth.XXXXXX")
          echo "DOCKER_CONFIG=$auth_dir" >> "$GITHUB_ENV"
      - name: Checkout the same source for independent comparison
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate with a fresh read-only job token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Pull the published digest on this fresh runner
        run: docker pull "$IMAGE@$IMAGE_DIGEST"
      - name: Verify private access, exact source, and offline runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ci/ghcr.py verify-pulled --digest "$IMAGE_DIGEST"
      - name: Remove temporary registry authentication
        if: always()
        run: docker logout ghcr.io
