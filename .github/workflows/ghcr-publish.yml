name: Publish private node artifacts
"on":
  # Registration only; both jobs require an explicitly dispatched run.
  push:
    paths:
      - .github/workflows/ghcr-publish.yml
  workflow_dispatch:
    inputs:
      target:
        description: Native binaries by default; Docker remains an explicit compatibility option
        type: choice
        default: native
        options: [native, docker, both, verify-native]
      source_revision:
        description: Full existing native release SHA (verify-native only)
        type: string
        required: false
      archive_sha256:
        description: Expected existing archive SHA256 (verify-native only)
        type: string
        required: false

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  IMAGE: ghcr.io/springiiii711-lgtm/xboard-node
  TAG: sha-${{ github.sha }}

concurrency:
  group: private-ghcr-xboard-node
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'springiiii711-lgtm/Xboard-Node' && github.ref == 'refs/heads/dev' && (inputs.target == 'docker' || inputs.target == 'both') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.published.outputs.digest }}
    steps:
      - name: Prepare isolated temporary registry authentication
        run: |
          umask 077
          auth_dir=$(mktemp -d "$RUNNER_TEMP/ghcr-auth.XXXXXX")
          echo "DOCKER_CONFIG=$auth_dir" >> "$GITHUB_ENV"
      - name: Checkout exact source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate source and publication guards
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B ci/validate.py
          python3 -B -m unittest discover -s ops/private-node/tests -p "test_*.py" -v
          python3 -B -m unittest discover -s ci -p test_ghcr.py -v

      - name: Check private repository and target package before building
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ci/ghcr.py state
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Read source metadata
        id: source
        run: |
          echo "source=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Build and load the exact checkout image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ci/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}

      - name: Check source identity and run offline before publication
        run: python3 -B ci/ghcr.py check-local
      - name: Verify installer with network-disabled disposable fixture containers
        env:
          CI_SAFE_DOCKER_TESTS: "1"
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_TEMP,GITHUB_RUN_ID,GITHUB_SHA,CI_SAFE_DOCKER_TESTS python3 -B ci/installer-container-check.py --image "$IMAGE:$TAG"
      - name: Recheck private package and immutable tag immediately before push
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ci/ghcr.py state
      - name: Authenticate with this job's short-lived token
        if: steps.state.outputs.digest == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish the tested image under its full source SHA
        if: steps.state.outputs.digest == ''
        run: docker push "$IMAGE:$TAG"
      - name: Verify private package metadata and capture its immutable digest
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ci/ghcr.py published
      - name: Remove temporary registry authentication
        if: always()
        run: docker logout ghcr.io

  native-publish:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'springiiii711-lgtm/Xboard-Node' && github.ref == 'refs/heads/dev' && (inputs.target == 'native' || inputs.target == 'both') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      archive_sha256: ${{ steps.release.outputs.archive_sha256 }}
      bootstrap_sha256: ${{ steps.release.outputs.bootstrap_sha256 }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Test native installer, publication guards and Go regressions
        env:
          GOTOOLCHAIN: local
        run: |
          python3 -B ci/validate.py
          python3 -B -m unittest discover -s ops/private-node/tests -p 'test_*.py' -v
          python3 -B -m unittest discover -s ci -p 'test_native*.py' -v
          go mod download
          go mod verify
          GOPROXY=off go test -mod=readonly -count=1 ./cmd/xbctl ./internal/config ./internal/tracker
          GOPROXY=off go test -mod=readonly -count=1 -timeout=45s ./internal/panel -run 'TestSecurity|TestGetConfig|TestGetUsers'
          GOPROXY=off go run -mod=readonly ./ci/check-workflow.go .github/workflows/*.yml
      - name: Build the complete upstream native matrix
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
        run: python3 -B ci/native-build.py --source-revision "$GITHUB_SHA" --output "$RUNNER_TEMP/native"
      - name: Check both native architectures without starting services
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user
          python3 -B ci/native-smoke.py --directory "$RUNNER_TEMP/native" --source-revision "$GITHUB_SHA"
      - name: Exercise real systemd with isolated disposable sleep fixtures
        env:
          CI_SAFE_NATIVE_TESTS: '1'
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_EVENT_NAME,GITHUB_REPOSITORY,GITHUB_SHA,RUNNER_TEMP,CI_SAFE_NATIVE_TESTS python3 -B ci/native-service-check.py --directory "$RUNNER_TEMP/native"
      - name: Publish immutable private native Release with this job token
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ci/native-release.py publish --directory "$RUNNER_TEMP/native"

  native-verify:
    needs: native-publish
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.repository == 'springiiii711-lgtm/Xboard-Node' && github.ref == 'refs/heads/dev' && (needs.native-publish.result == 'success' || inputs.target == 'verify-native') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout same source for independent verification
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify private download with a fresh read-only job token
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_SHA256: ${{ inputs.target == 'verify-native' && inputs.archive_sha256 || needs.native-publish.outputs.archive_sha256 }}
          RELEASE_SOURCE: ${{ inputs.target == 'verify-native' && inputs.source_revision || github.sha }}
        run: python3 -B ci/native-release.py verify --source-revision "$RELEASE_SOURCE" --archive-sha256 "$ARCHIVE_SHA256"

  verify-pull:
    needs: publish
    if: ${{ github.event_name == 'workflow_dispatch' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - name: Prepare isolated temporary registry authentication
        run: |
          umask 077
          auth_dir=$(mktemp -d "$RUNNER_TEMP/ghcr-auth.XXXXXX")
          echo "DOCKER_CONFIG=$auth_dir" >> "$GITHUB_ENV"
      - name: Checkout the same source for independent comparison
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate with a fresh read-only job token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Pull the published digest on this fresh runner
        run: docker pull "$IMAGE@$IMAGE_DIGEST"
      - name: Verify private access, exact source, and offline runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ci/ghcr.py verify-pulled --digest "$IMAGE_DIGEST"
      - name: Remove temporary registry authentication
        if: always()
        run: docker logout ghcr.io
